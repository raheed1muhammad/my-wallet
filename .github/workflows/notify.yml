name: Recurring reminders

# Runs every hour and sends a reminder for recurring items that are due today.
# Only a schedule and a manual start can run this, so the secret below is never given to pull requests from other people.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send ONE test message to the account whose email is in the TEST_EMAIL secret (leave off for the normal run)'
        type: boolean
        default: false
      announce_id:
        description: 'New-feature message: a short unique id (for example feat-balance-check). Leave empty for the normal run. The title and message below are public, so write no private details.'
        type: string
        default: ''
      announce_title:
        description: 'New-feature message title'
        type: string
        default: ''
      announce_body:
        description: 'New-feature message text'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    if: github.repository == 'raheed1muhammad/my-wallet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the Firebase tool
        run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - name: Send reminders
        run: node tools/notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ONLY_EMAIL: ${{ secrets.TEST_EMAIL }}
          ANNOUNCE_ID: ${{ github.event.inputs.announce_id }}
          ANNOUNCE_TITLE: ${{ github.event.inputs.announce_title }}
          ANNOUNCE_BODY: ${{ github.event.inputs.announce_body }}
          SEND_TEST: ${{ github.event.inputs.send_test == 'true' && '1' || '0' }}
